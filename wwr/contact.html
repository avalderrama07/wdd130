<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splash White Water Rafting | Contact Us</title>
    <meta name="description"
      content="Contact White Water Rafting for questions, reservations, and information about our rafting trips.">
    <meta name="author" content="Aron Valderrama">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/wwr-logo.png" alt="Splash White Water Rafting Logo" class="logo">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Splash White Water Rafting</h1>
        <section class="info">
            <address>
                <p>123 Main River Street</p>
                <p>Kolob, California</p>
                <p>+1 999 999 9999</p>
                <p>info@splashwhitewater.com</p>
            </address>
        </section>
        <section class="contact-grid">
            <div class="map">
                <iframe title="Google Map location of Splash White Water Rafting"
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.83543450937!2d-122.4194155!3d37.7749295!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8085808580858085%3A0x0!2zMzfCsDQ2Jz2OS3B1ZyIsIFVT!5e0!3m2!1sen!2sus!4v1600000000000!5m2!1sen!2sus"></iframe>
            </div>

            <form class="form" action="#" method="post">
                <div class="form-item">
                    <label for="username">Name:</label>
                    <input type="text" id="username" name="username" placeholder="Your Full Name"
                      required>
                </div>
                <div class="form-item">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="email@example.com"
                      required>
                </div>
                <fieldset class="radio-group">
                    <legend>Message Purpose</legend>
                    <label><input type="radio" id="general" name="purpose" value="general">
                        General
                        Inquiry</label>
                    <label><input type="radio" id="reservation" name="purpose" value="reservation"
                          checked>
                        Reservation Question</label>
                    <label><input type="radio" id="suggestion" name="purpose" value="suggestion">
                        Website Suggestion</label>
                </fieldset>
                <div class="form-item">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="4" placeholder="Type here..."
                      required></textarea>
                </div>
                <div class="form-item checkbox-item">
                    <label for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter"> Please
                        Subscribe
                        me to the monthly newsletter
                    </label>
                </div>
                <button type="submit">Get in touch!</button>
            </form>
        </section>
        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/person1.jpg" alt="Manager Peter Jhonson">
                    <figcaption>Peter Jhonson - Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/person2.jpg" alt="Lead Guide Jane Brown">
                    <figcaption>Jane Brown - Lead Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/person3.jpg" alt="Safety Director Alex Smith">
                    <figcaption>Alex Smith - Safety Director</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>©2026 ❖ Splash White Water Rafting ❖ Aron Valderrama</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://instagram.com" target="_blank">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
            <a href="https://tiktok.com" target="_blank">
                <img src="images/tiktok.svg" alt="TikTok Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
